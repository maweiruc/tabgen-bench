id: credit_g
source:
  provider: openml
  data_id: 31
  version: 1
  upstream_url: https://www.openml.org/d/31
  dictionary_url: https://archive.ics.uci.edu/dataset/144/statlog+german+credit+data
  citation: Hofmann (1994), Statlog German Credit Data, UCI, DOI 10.24432/C5NC77
  license_note: 'OpenML: Public; UCI source page: CC BY 4.0 (verified 2026-10-25);
    source data not redistributed'
target:
  column: class
  task: binary_classification
